# O plano gratuito do Supabase pausa o projeto depois de uma semana sem chamadas à API.
# Enquanto nenhuma placa publica, este ping diário conta como atividade e evita a pausa.
# Usa só a chave publishable, que é pública, e chama vagas.agora(), que não grava nada.
name: Manter o banco ativo

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Blumenau
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar vagas.agora() no Supabase
        env:
          URL: https://hsfsejmhltkxiwniuunf.supabase.co
          CHAVE: sb_publishable_wm8PKvRSGzwYI8cdqi9pKQ__ToBX3oW
        run: |
          codigo=$(curl -s -o resposta.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/agora" \
            -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" \
            -H "Content-Profile: vagas" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $codigo: $(cat resposta.txt)"
          test "$codigo" = "200"
